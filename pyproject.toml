[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-analyzer"
version = "1.0.0"
description = "Intelligent Resume Analyzer — AI-powered hiring assistant with deterministic core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "python-docx>=1.0",
    "rapidfuzz>=3.0,<4.0",
    "Jinja2>=3.1",
    "reportlab>=4.0",
    "openpyxl>=3.1",
    "streamlit>=1.30",
    "tqdm>=4.60",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "bandit>=1.7",
    "radon>=6.0",
    "types-PyYAML",
    "types-requests",
]

[project.scripts]
resume-analyzer = "resume_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.png", "*.svg", "*.ico"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "C90",  # mccabe complexity
    "D",    # pydocstyle
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "S701", # Jinja autoescape (AI prompt templates are plain text)
    "S310", # Audit urlopen (endpoints are HTTPS/HTTP validated)
    "S314", # xml parsing (decompression and archive bounds are checked prior)
    "UP042", # str, Enum inheritance preserved for Python 3.10 compatibility
    "C901", # McCabe complexity (monitored separately via Radon CC)
    "D100", # Missing docstring in public module
    "D101", # Missing docstring in public class
    "D102", # Missing docstring in public method
    "D103", # Missing docstring in public function
    "D104", # Missing docstring in public package
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in __init__
    "D301", # Use r""" if backslashes in docstring
    "B007", # Loop control variable not used
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "D", "B017", "B905", "B007", "F841"]
"samples/*" = ["D", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "evaluation: marks evaluation benchmarks (ET-*)",
    "performance: marks performance benchmark probes (PT-*)",
    "slow: marks slow running tests",
]

[tool.bandit]
exclude_dirs = ["tests", "data", "samples", "logs"]
skips = ["B101"]  # assert used in tests

